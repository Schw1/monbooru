name: Docker dev image

# Builds the CPU image for amd64 from the branch and pushes it as
# ghcr.io/<owner>/monbooru:dev-<branch>, for testing. Runs on every push
# to the feature branch, or by hand from the Actions tab.
on:
  push:
    branches:
      - Scheduled-database-export
  workflow_dispatch:

permissions:
  contents: read
  packages: write

jobs:
  docker:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1

      - name: Image name and tag
        id: img
        run: |
          echo "NAME=$(echo '${{ github.repository }}' | tr '[:upper:]' '[:lower:]')" >> "$GITHUB_OUTPUT"
          echo "TAG=dev-$(echo '${{ github.ref_name }}' | tr '[:upper:]' '[:lower:]' | tr -c 'a-z0-9._\n-' '-')" >> "$GITHUB_OUTPUT"

      - name: Set up Buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1

      - name: Login to GHCR
        uses: docker/login-action@81c6f93d4bc991e510b342a00b419b3bb4efc5c6 # v4.7.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push
        uses: docker/build-push-action@c3c9e263c25d99ce0380d002d59b67737d91b0dc # v7.4.0
        with:
          context: .
          file: docker/Dockerfile
          platforms: linux/amd64
          push: true
          tags: ghcr.io/${{ steps.img.outputs.NAME }}:${{ steps.img.outputs.TAG }}

      - name: Smoke test
        run: |
          docker run --rm --entrypoint /usr/local/bin/monbooru \
            ghcr.io/${{ steps.img.outputs.NAME }}:${{ steps.img.outputs.TAG }} \
            -hash-password smoke-test
